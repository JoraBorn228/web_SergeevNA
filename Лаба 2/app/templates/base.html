<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% if title %}{{ title }} — {% endif %}Лабораторная работа №2</title>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; }
        .site-footer { background: #212529; color: #adb5bd; }
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Лаб. работа №2</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('url_params') }}">Параметры URL</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('headers') }}">Заголовки</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('cookies') }}">Cookie</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('form_params') }}">Форма</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('phone') }}">Телефон</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="py-4">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</main>

<footer class="site-footer py-3 mt-auto">
    <div class="container text-center">
        <span>Сергеев Никита Андреевич &mdash; группа 241-372</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
