{% extends "base.html" %}
{% block content %}
<h1 class="mb-4">Заголовки запроса</h1>
<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr><th>Заголовок</th><th>Значение</th></tr>
    </thead>
    <tbody>
        {% for key, value in headers.items() %}
        <tr>
            <td><code>{{ key }}</code></td>
            <td class="text-break">{{ value }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
