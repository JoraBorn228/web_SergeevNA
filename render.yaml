# Конфигурация для деплоя лабораторных работ №3 и №4 на Render (https://render.com)
# Render автоматически прочитает этот файл из корня репозитория.
services:
  - type: web
    name: flask-lab3
    runtime: python
    plan: free
    rootDir: "Лаба 3/app"
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: flask-lab4
    runtime: python
    plan: free
    rootDir: "Лаба 4/app"
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # SQLite на бесплатном тарифе эфемерна: БД пересоздаётся при перезапуске
      - key: DATABASE
        value: /tmp/lab4.sqlite

  - type: web
    name: flask-lab5
    runtime: python
    plan: free
    rootDir: "Лаба 5/app"
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE
        value: /tmp/lab5.sqlite
