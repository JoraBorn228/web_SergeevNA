{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4 text-center">Изменение пароля</h1>
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <form method="post" action="{{ url_for('change_password') }}" novalidate>
                    <div class="mb-3">
                        <label for="old_password" class="form-label">Старый пароль</label>
                        <input type="password"
                               id="old_password"
                               name="old_password"
                               class="form-control {% if errors.old_password %}is-invalid{% endif %}"
                               autocomplete="current-password">
                        {% if errors.old_password %}<div class="invalid-feedback">{{ errors.old_password }}</div>{% endif %}
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">Новый пароль</label>
                        <input type="password"
                               id="new_password"
                               name="new_password"
                               class="form-control {% if errors.new_password %}is-invalid{% endif %}"
                               autocomplete="new-password">
                        {% if errors.new_password %}<div class="invalid-feedback">{{ errors.new_password }}</div>{% endif %}
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Повторите новый пароль</label>
                        <input type="password"
                               id="confirm_password"
                               name="confirm_password"
                               class="form-control {% if errors.confirm_password %}is-invalid{% endif %}"
                               autocomplete="new-password">
                        {% if errors.confirm_password %}<div class="invalid-feedback">{{ errors.confirm_password }}</div>{% endif %}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
