{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Отчёт по пользователям</h1>
    <a href="{{ url_for('reports.visits') }}" class="btn btn-secondary">К журналу</a>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th scope="col">№</th>
                <th scope="col">Пользователь</th>
                <th scope="col">Количество посещений</th>
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ row.name }}</td>
                <td>{{ row.cnt }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="text-center text-muted">Данные отсутствуют.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<a href="{{ url_for('reports.export_users') }}" class="btn btn-success">Экспорт в CSV</a>
{% endblock %}
