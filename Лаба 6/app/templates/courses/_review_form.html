{% if own_review %}
    <h3 class="h5 mt-4">Ваш отзыв</h3>
    {% set review = own_review %}
    {% include 'courses/_review.html' %}
{% elif current_user.is_authenticated %}
    <h3 class="h5 mt-4">Оставить отзыв</h3>
    <form method="post" action="{{ url_for('courses.reviews', course_id=course.id) }}" class="mt-3">
        <div class="mb-3">
            <label for="rating" class="form-label">Оценка</label>
            <select class="form-select" id="rating" name="rating" required>
                <option value="5" selected>5 — отлично</option>
                <option value="4">4 — хорошо</option>
                <option value="3">3 — удовлетворительно</option>
                <option value="2">2 — неудовлетворительно</option>
                <option value="1">1 — плохо</option>
                <option value="0">0 — ужасно</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="review-text" class="form-label">Текст отзыва</label>
            <textarea class="form-control" id="review-text" name="text" rows="4" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Отправить отзыв</button>
    </form>
{% else %}
    <p class="mt-4"><a href="{{ url_for('auth.login', next=request.path) }}">Войдите</a>, чтобы оставить отзыв.</p>
{% endif %}
